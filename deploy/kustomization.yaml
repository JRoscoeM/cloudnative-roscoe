# Argo CD deploys this folder to your team's namespace. The GitHub Action
# sets the image below on every push to main; don't edit newName or newTag
# by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-roscoe
resources:
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - httproute.yaml
images:
  - name: app
    newName: ghcr.io/jroscoem/cloudnative-roscoe
    newTag: dd2aefa
